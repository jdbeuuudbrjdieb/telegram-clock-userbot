name: Run Master Clock Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

# 🛡️ این بخش جادویی است: اگر اجرای قبلی هنوز روشن باشد، آن را می‌کشد و اجرای جدید را روشن می‌کند
concurrency:
  group: master-clock-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Clock
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          BASE_NAME: ${{ secrets.BASE_NAME }}
        run: |
          echo "Starting..."
          timeout 19500 python bot.py || echo "Restarting..."

      - name: Trigger next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches" \
            -d '{"ref":"main"}'
